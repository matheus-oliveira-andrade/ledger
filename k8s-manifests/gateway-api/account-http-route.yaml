apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: account-nginx-httproute
  namespace: default
spec:
  parentRefs:
  - name: nginx-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /account
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: account-api-service
      port: 9000
  
  - matches:
    - path:
        type: PathPrefix
        value: /account-grpc
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: account-api-service
      port: 9001